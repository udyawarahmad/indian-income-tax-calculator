appId: ai.arena.income-tax-calculator
productName: Indian Income Tax Calculator
directories:
  output: dist
  buildResources: build
files:
  - main.js
  - preload.js
  - package.json
extraResources:
  - from: ../backend/dist/tax-calculator-backend
    to: backend/tax-calculator-backend
    filter:
      - "**/*"
  - from: ../frontend/dist
    to: frontend-dist
    filter:
      - "**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "Indian-Income-Tax-Calculator-Setup-${version}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Indian Income Tax Calculator"
mac:
  target:
    - dmg
linux:
  target:
    - AppImage
publish: null
